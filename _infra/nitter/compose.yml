services:
  nitter:
    image: zedeus/nitter@sha256:e5a51a51e783acb3646ea71b95f190cb23a9ec4de78483c9815f4052a1723bd9
    container_name: nitter
    ports:
      - "127.0.0.1:9377:8080"
    volumes:
      - "${NITTER_CONFIG_PATH}:/src/nitter.conf:ro"
      - "${NITTER_SESSIONS_PATH}:/src/sessions.jsonl:ro"
    depends_on:
      nitter-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -nv --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 2
    user: "998:998"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nitter-redis:
    image: redis@sha256:c9ab371a96b057d3642be9bd71cb1b3fe97920d345dc949860578bffb3d54460
    container_name: nitter-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - nitter-redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 2
    user: "999:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  nitter-redis:
