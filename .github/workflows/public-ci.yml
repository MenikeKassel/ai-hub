name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r _automation/trading_research/requirements.lock

      - name: Compile Python sources
        run: |
          python -m compileall -q _automation scripts
          echo "compileall OK"

      - name: Run unit tests (trading_research)
        working-directory: _automation/trading_research/tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Run unit tests (codex-delegate)
        working-directory: _automation/codex-delegate/tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Run unit tests (hermes-capture, function style)
        working-directory: _automation/hermes-capture/tests
        run: |
          set -e
          for t in test_parse test_mediacrawler_importer test_mediacrawler_queue test_mediacrawler_runner test_zhihu_local_capture; do
            python "$t.py"
          done
          echo "hermes-capture function tests OK"

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: _automation/trading_research/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: _automation/trading_research/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Security scan (Gitleaks + dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r _automation/trading_research/requirements.txt --desc on --no-deps || true

      - name: Audit frontend dependencies
        working-directory: _automation/trading_research/ui
        run: npm audit --omit=dev --audit-level=high || true

  mirror-scan:
    name: Public mirror hygiene check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run mirror hygiene checks
        run: |
          python scripts/check_public_mirror.py
